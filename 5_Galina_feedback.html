<main class="container">
    <div class="writer">
        <h1>Напишите нам</h1>
        <p>Заполните форму, чтобы отправить сообщение</p>
    </div>

    <div class="intro-card">
        <div class="intro-text">
            <form action="#" method="post" enctype="multipart/form-data">

                <div class="form-group">
                    <label for="name">Ваше имя</label>
                    <input type="text" id="name" name="name" required placeholder="Введите ваше имя">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="example@mail.ru">
                </div>

                <div class="form-group">
                    <label for="message">Сообщение</label>
                    <textarea id="message" name="message" required placeholder="Напишите ваше сообщение..."></textarea>
                </div>

                <div class="form-group">
                    <label for="file">Прикрепить файлы</label>
                    <input type="file" id="file" name="attachment">
                </div>

                <div class="fbtns-align">
                    <button type="reset" class="fbtns">Очистить форму</button>
                    <button type="submit" class="fbtns">Отправить сообщение</button>
                </div>

            </form>
        </div>
    </div>
</main>
